name: Native desktop artifacts

on:
  workflow_dispatch:
  push:
    tags: ['v3.5.*']

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve one dependency graph for all three builds
        shell: bash
        run: |
          if [ ! -f Cargo.lock ]; then cargo generate-lockfile; fi
          cargo metadata --locked --format-version 1 > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-lockfile
          path: Cargo.lock
          if-no-files-found: error
  desktop:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: resolved-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libasound2-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: python scripts/source_audit.py
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets --all-features
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo build --locked --release --workspace
      - name: Test the actual release runtime
        shell: bash
        run: |
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          python scripts/smoke.py --binary "target/release/kairo$suffix"
          python scripts/package_smoke.py --binary "target/release/kairo$suffix"
      - name: Collect third-party license notices
        run: |
          cargo install cargo-bundle-licenses --version 4.2.0 --locked
          cargo bundle-licenses --format json --output dependency-licenses.json
      - name: Package native editor and runtime
        run: python scripts/desktop_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Kairo-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/kairo2d-*.zip
            dist/kairo2d-*.zip.sha256
          if-no-files-found: error
          retention-days: 30
