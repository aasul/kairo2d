name: Linux software-GPU smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build and software graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libasound2-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev mesa-vulkan-drivers xvfb
      - run: cargo build -p kairo-cli
      - name: Exercise a real window and surface
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          trap 'rm -rf "$XDG_RUNTIME_DIR"' EXIT
          xvfb-run -a python scripts/smoke.py --windowed --frames 12
          xvfb-run -a python scripts/package_smoke.py --windowed
