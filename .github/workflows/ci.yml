name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Stable Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libasound2-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Repository consistency
        run: python scripts/source_audit.py
      - name: Generated Lua API reference
        run: python scripts/generate_api_docs.py --check
      - name: Check every target
        run: cargo check --workspace --all-targets --all-features
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Unit and integration tests
        run: cargo test --workspace --all-features
      - name: Build both executables
        run: cargo build --workspace
      - name: Headless runtime example smoke tests
        run: python scripts/smoke.py
      - name: Project export and relocation smoke tests
        run: python scripts/package_smoke.py
